name: pxss-bid-agent

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: pxss-bid-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pxss_bid_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pxss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pxss_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pxss} -d ${POSTGRES_DB:-pxss_bid_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: pxss-bid-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: pxss-bid-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pxss_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pxss_minio_password}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: pxss-bid-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pxss_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pxss_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-bid-agent}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "

  # Embedding + Rerank 推理服务（Infinity，OpenAI 风格 /embeddings 与 /rerank）。
  # Mac 开发：CPU 自动；Linux/GPU 部署：command 末尾追加 --device cuda 即可复用同镜像。
  infinity:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:latest}
    container_name: pxss-bid-agent-infinity
    restart: unless-stopped
    environment:
      HF_HOME: /app/.cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    command:
      - v2
      - --model-id
      - ${INFINITY_EMBEDDING_MODEL:-BAAI/bge-base-zh-v1.5}
      - --model-id
      - ${INFINITY_RERANK_MODEL:-BAAI/bge-reranker-base}
      - --engine
      - torch
      # reranker 启动预热前向在部分环境会崩，跳过预热；真实推理正常。
      - --no-model-warmup
      - --port
      - "7997"
    ports:
      - "${INFINITY_PORT:-7997}:7997"
    volumes:
      - infinity_hf_cache:/app/.cache/huggingface
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7997/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  infinity_hf_cache:
