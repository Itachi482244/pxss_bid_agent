name: pxss-bid-agent

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: pxss-bid-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pxss_bid_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pxss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pxss_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pxss} -d ${POSTGRES_DB:-pxss_bid_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: pxss-bid-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: pxss-bid-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pxss_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pxss_minio_password}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: pxss-bid-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pxss_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pxss_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-bid-agent}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "

  # 旧版二进制 .doc -> .docx 转换 sidecar（headless LibreOffice + 标准库 HTTP）。
  # 原生后端通过 LEGACY_DOC_CONVERTER_URL 调用，等同于访问 infinity 的方式。
  # 本地/原生后端推荐用本服务；生产 compose 当前走 subprocess（backend 镜像内置 LibreOffice）。
  libreoffice-converter:
    image: ${LIBREOFFICE_CONVERTER_IMAGE:-pxss-bid-agent-libreoffice-converter:latest}
    build:
      context: ./infra/docker/libreoffice-converter
      args:
        # 国内网络可设 APT_MIRROR=mirrors.aliyun.com 加速 LibreOffice 下载。
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: pxss-bid-agent-libreoffice-converter
    restart: unless-stopped
    environment:
      PORT: "2004"
      CONVERTER_TIMEOUT_SECONDS: ${LEGACY_DOC_CONVERSION_TIMEOUT_SECONDS:-120}
    ports:
      - "${LIBREOFFICE_CONVERTER_PORT:-2004}:2004"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:2004/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
