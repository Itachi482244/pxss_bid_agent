name: pxss-bid-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: pxss-bid-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pxss_bid_agent
      POSTGRES_USER: pxss
      POSTGRES_PASSWORD: pxss_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pxss -d pxss_bid_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pxss-bid-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pxss-bid-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pxss-bid-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
      MINIO_BUCKET: bid-agent
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "

  # Embedding + Rerank 推理服务（Infinity，OpenAI 风格 /embeddings 与 /rerank）。
  # 生产环境为 Linux / x86_64：官方镜像原生 amd64，无模拟问题，rerank 正常。
  # GPU 部署在 command 末尾追加 --device cuda（需 nvidia container runtime）。
  # ⚠️ 不要在 Apple Silicon(Mac) 上跑本服务（模拟运行 reranker 会卡死）；Mac 本地用原生 Infinity（infra/infinity-local）。
  infinity:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:latest}
    container_name: pxss-bid-agent-infinity
    restart: unless-stopped
    environment:
      HF_HOME: /app/.cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    command:
      - v2
      - --model-id
      - ${INFINITY_EMBEDDING_MODEL:-BAAI/bge-base-zh-v1.5}
      - --model-id
      - ${INFINITY_RERANK_MODEL:-BAAI/bge-reranker-base}
      - --engine
      - torch
      # reranker 启动预热前向在部分环境会崩，跳过预热；真实推理正常。
      - --no-model-warmup
      - --port
      - "7997"
    ports:
      - "${INFINITY_PORT:-7997}:7997"
    volumes:
      - infinity_hf_cache:/app/.cache/huggingface
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7997/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可设 APT_MIRROR=mirrors.aliyun.com 加速 LibreOffice 下载。
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: pxss-bid-agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      infinity:
        condition: service_started
    environment:
      APP_NAME: pxss-bid-agent
      APP_ENV: production
      APP_DEBUG: "false"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://pxss:pxss_dev_password@postgres:5432/pxss_bid_agent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
      MINIO_BUCKET: bid-agent
      # embedding/rerank 走内网 infinity 服务（不是 localhost：容器里 localhost 指向自身）。
      EMBEDDING_BASE_URL: http://infinity:7997
      RERANK_BASE_URL: http://infinity:7997
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      FRONTEND_DIST_DIR: /app/frontend/dist
      # backend 镜像（Dockerfile）已内置 libreoffice-writer，旧版 .doc 直接走本机 soffice，
      # 无需再常驻 libreoffice-converter sidecar。若改用 sidecar，则设为 http 并提供
      # LEGACY_DOC_CONVERTER_URL=http://libreoffice-converter:2004。
      LEGACY_DOC_CONVERTER_MODE: subprocess
    ports:
      - "5173:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  infinity_hf_cache:
