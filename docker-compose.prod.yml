name: pxss-bid-agent

services:
  postgres:
    image: postgres:16-alpine
    container_name: pxss-bid-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pxss_bid_agent
      POSTGRES_USER: pxss
      POSTGRES_PASSWORD: pxss_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pxss -d pxss_bid_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pxss-bid-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pxss-bid-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pxss-bid-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
      MINIO_BUCKET: bid-agent
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pxss-bid-agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: pxss-bid-agent
      APP_ENV: production
      APP_DEBUG: "false"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://pxss:pxss_dev_password@postgres:5432/pxss_bid_agent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: pxss_minio
      MINIO_ROOT_PASSWORD: pxss_minio_password
      MINIO_BUCKET: bid-agent
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      FRONTEND_DIST_DIR: /app/frontend/dist
    ports:
      - "5173:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
