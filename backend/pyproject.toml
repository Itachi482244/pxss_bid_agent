[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxss-bid-agent-backend"
version = "0.1.0"
description = "Backend service for the PXSS bid agent."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "alibabacloud-ocr-api20210707>=3.1.2",
  "celery>=5.3.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "openpyxl>=3.1.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "structlog>=24.1.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]
docs = [
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
